# Render.com blueprint — one-click backend deploy.
# In the Render dashboard: New > Blueprint > point at this repo (Blueprint Path: backend/render.yaml).
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: sqlite:///./zoomclone.db
      - key: FRONTEND_URL
        sync: false  # set to your deployed frontend URL
      - key: CORS_ORIGINS
        sync: false  # set to your deployed frontend URL
      - key: SEED_ON_STARTUP
        value: "true"
# NOTE: For durable storage in production, use a paid instance with a persistent
# disk (mountPath: /var/data, DATABASE_URL=sqlite:////var/data/zoomclone.db) or a
# managed Postgres. The free tier is ephemeral and re-seeds on restart.
